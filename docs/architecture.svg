<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#424a53"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; white-space: pre; }
      .title { font-size: 26px; font-weight: 700; }
      .sub { font-size: 14px; fill: #57606a; }
      .h { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .t { font-size: 13px; }
      .b { font-size: 13px; font-weight: 700; }
      .c { font-family: Consolas, "Cascadia Mono", Menlo, monospace; font-size: 12px; fill: #0a3069; }
      .s { font-size: 11px; fill: #57606a; }
      .box { fill: #ffffff; stroke-width: 1.5; }
      .flow { stroke: #424a53; stroke-width: 2; fill: none; marker-end: url(#arr); }
    </style>
  </defs>

  <rect width="1600" height="990" fill="#ffffff"/>

  <text x="30" y="42" class="title">NSE Brand Risk Monitor — System Architecture</text>
  <text x="30" y="68" class="sub">NSE prices + news headlines → five signals (3 stock, 2 news) → AHP weights → fixed-ideal TOPSIS → daily risk score 0–100 → history, dashboard &amp; API</text>

  <!-- ===================== ROW A: scoring pipeline ===================== -->

  <!-- 1 Data sources -->
  <rect x="30" y="100" width="276" height="420" rx="8" class="box" stroke="#0e7490"/>
  <path d="M30,108 a8,8 0 0 1 8,-8 h260 a8,8 0 0 1 8,8 v28 h-276 z" fill="#0e7490"/>
  <text x="44" y="124" class="h">① Data sources</text>
  <text x="44" y="160" class="b">NSE share prices</text>
  <text x="50" y="179" class="t">• Yahoo Finance chart data</text>
  <text x="50" y="197" class="t">• SYMBOL.NS + NIFTY 50 (^NSEI)</text>
  <text x="50" y="215" class="t">• 1 year daily, split/dividend-adjusted</text>
  <text x="50" y="233" class="t">• Past periods for search &amp; back-test</text>
  <text x="44" y="261" class="b">Google News search</text>
  <text x="50" y="280" class="t">• Per company, India edition</text>
  <text x="50" y="298" class="t">• Live when:50d · past after:/before:</text>
  <text x="44" y="326" class="b">Outlet RSS feeds (latest 3 days)</text>
  <text x="50" y="345" class="t">• Business Standard · Economic Times</text>
  <text x="50" y="363" class="t">• Livemint · BusinessLine · CNBC-TV18</text>
  <text x="50" y="381" class="t">• NDTV Profit · Indian Express</text>
  <text x="50" y="399" class="t">• Moneycontrol news sitemap</text>
  <text x="44" y="427" class="b">Company lookup (search)</text>
  <text x="50" y="446" class="t">• Watchlist → directory → Yahoo search</text>
  <text x="50" y="464" class="t">• NSE equities only, sector mapped</text>
  <text x="44" y="502" class="s">Downloads cached in backend/cache/</text>

  <!-- 2 Ingestion & NLP -->
  <rect x="346" y="100" width="276" height="420" rx="8" class="box" stroke="#1f6feb"/>
  <path d="M346,108 a8,8 0 0 1 8,-8 h260 a8,8 0 0 1 8,8 v28 h-276 z" fill="#1f6feb"/>
  <text x="360" y="124" class="h">② Ingestion &amp; NLP</text>
  <text x="360" y="160" class="c">market/nse_prices.py</text>
  <text x="366" y="179" class="t">• Retries, cache, offline mode</text>
  <text x="366" y="197" class="t">• Fills the newest bar after the close</text>
  <text x="360" y="225" class="c">nlp/news.py · nlp/feeds.py</text>
  <text x="366" y="244" class="t">• Headline must name the company</text>
  <text x="366" y="262" class="t">• Exclusions (SBI ≠ SBI Life)</text>
  <text x="366" y="280" class="t">• Wrap-ups and duplicates removed</text>
  <text x="360" y="308" class="c">nlp/sentiment.py</text>
  <text x="366" y="327" class="t">• FinBERT: P(pos) − P(neg)</text>
  <text x="366" y="345" class="t">• Fallback: finance word list</text>
  <text x="366" y="363" class="t">• Negative ≤ −0.15, positive ≥ +0.15</text>
  <text x="360" y="391" class="c">nlp/crisis_classifier.py</text>
  <text x="366" y="410" class="t">• 13 issue types + regulators named</text>
  <text x="366" y="428" class="t">• Explains the score, never changes it</text>
  <text x="360" y="502" class="s">HTML entities decoded, accents normalised</text>

  <!-- 3 Five signals -->
  <rect x="662" y="100" width="276" height="420" rx="8" class="box" stroke="#8250df"/>
  <path d="M662,108 a8,8 0 0 1 8,-8 h260 a8,8 0 0 1 8,8 v28 h-276 z" fill="#8250df"/>
  <text x="676" y="124" class="h">③ Five signals (0–100 points)</text>
  <text x="676" y="160" class="c">market/stock_signals.py</text>
  <text x="682" y="179" class="t">expected = β·NIFTY + γ·(peers − NIFTY)</text>
  <text x="682" y="197" class="t">abnormal = actual − expected</text>
  <text x="676" y="225" class="b">C1 Market reaction</text>
  <text x="682" y="243" class="t">abnormal-return z-score, 5 &amp; 20 days</text>
  <text x="676" y="271" class="b">C2 Trading stress</text>
  <text x="682" y="289" class="t">volatility &amp; volume spikes while falling</text>
  <text x="676" y="317" class="b">C3 Lingering damage</text>
  <text x="682" y="335" class="t">abnormal line below its 3-month best</text>
  <text x="676" y="363" class="c">engine/criteria.py (news)</text>
  <text x="682" y="381" class="t">recency weight 0.5^(age / 72 h)</text>
  <text x="676" y="409" class="b">C4 News tone</text>
  <text x="682" y="427" class="t">negativity of opinionated headlines</text>
  <text x="676" y="455" class="b">C5 Negative coverage</text>
  <text x="682" y="473" class="t">weighted count of negative stories</text>
  <text x="676" y="502" class="s">No news → C4 = C5 = 0 (stock evidence only)</text>

  <!-- 4 AHP + TOPSIS -->
  <rect x="978" y="100" width="276" height="420" rx="8" class="box" stroke="#bf3989"/>
  <path d="M978,108 a8,8 0 0 1 8,-8 h260 a8,8 0 0 1 8,8 v28 h-276 z" fill="#bf3989"/>
  <text x="992" y="124" class="h">④ AHP weights + TOPSIS</text>
  <text x="992" y="160" class="c">mcdm/ahp.py</text>
  <text x="998" y="179" class="t">• 5×5 pairwise matrix (Saaty 1–9)</text>
  <text x="998" y="197" class="t">• Principal-eigenvector weights</text>
  <text x="998" y="215" class="t">  C1 36.9% · C2 10.9% · C3 20.6%</text>
  <text x="998" y="233" class="t">  C4 20.6% · C5 10.9%</text>
  <text x="998" y="251" class="t">• λmax 5.013 · CR 0.003 &lt; 0.10</text>
  <text x="992" y="279" class="c">mcdm/topsis.py</text>
  <text x="998" y="298" class="t">• v = w · points / 100</text>
  <text x="998" y="316" class="t">• A⁺ = 0 (safest) · A⁻ = 100 (worst)</text>
  <text x="998" y="334" class="t">• Score = 100 · D⁺ / (D⁺ + D⁻)</text>
  <text x="992" y="362" class="b">Levels</text>
  <text x="998" y="381" class="t">Low &lt; 30 · Moderate 30–50 · High ≥ 50</text>
  <text x="992" y="409" class="b">90% range</text>
  <text x="998" y="428" class="t">200 bootstrap resamples of headlines</text>
  <text x="992" y="502" class="s">Fixed ideals → scores comparable across days</text>

  <!-- 5 Outputs & tracking -->
  <rect x="1294" y="100" width="276" height="420" rx="8" class="box" stroke="#1a7f37"/>
  <path d="M1294,108 a8,8 0 0 1 8,-8 h260 a8,8 0 0 1 8,8 v28 h-276 z" fill="#1a7f37"/>
  <text x="1308" y="124" class="h">⑤ Scoring run &amp; tracking</text>
  <text x="1308" y="160" class="c">engine/assess.py</text>
  <text x="1314" y="179" class="t">• One scorer: pipeline, search, back-test</text>
  <text x="1308" y="207" class="c">engine/risk_scorer.py</text>
  <text x="1314" y="226" class="t">• NIFTY 100 (50 + Next 50), point-in-time</text>
  <text x="1314" y="244" class="t">• 30-day backfill; last 5 days refreshed</text>
  <text x="1308" y="272" class="c">backend/output/</text>
  <text x="1314" y="291" class="t">• history.json — daily track (≤ 400 days)</text>
  <text x="1314" y="309" class="t">• latest.json — full results</text>
  <text x="1314" y="327" class="t">• backtest.json — validation</text>
  <text x="1308" y="355" class="c">js/data.js</text>
  <text x="1314" y="374" class="t">• Everything the dashboard shows</text>
  <text x="1308" y="402" class="b">Daily job (GitHub Actions)</text>
  <text x="1314" y="421" class="t">• 16:45 IST, Mon–Fri, after the close</text>
  <text x="1314" y="439" class="t">• tests → pipeline → commit → Pages</text>
  <text x="1308" y="502" class="s">CLI: py -3 backend/run_pipeline.py</text>

  <!-- Row A arrows -->
  <path d="M306,310 H344" class="flow"/>
  <path d="M622,310 H660" class="flow"/>
  <path d="M938,310 H976" class="flow"/>
  <path d="M1254,310 H1292" class="flow"/>

  <!-- ===================== ROW B ===================== -->

  <!-- 6 Robustness & validation -->
  <rect x="30" y="590" width="500" height="340" rx="8" class="box" stroke="#9a6700"/>
  <path d="M30,598 a8,8 0 0 1 8,-8 h484 a8,8 0 0 1 8,8 v28 h-500 z" fill="#9a6700"/>
  <text x="44" y="614" class="h">⑥ Robustness &amp; validation</text>
  <text x="44" y="650" class="c">mcdm/critic.py · mcdm/sensitivity.py</text>
  <text x="50" y="669" class="t">• CRITIC objective weights, 50/50 blend, equal weights</text>
  <text x="50" y="687" class="t">• Every AHP judgement ±1 Saaty step (20 variants)</text>
  <text x="50" y="705" class="t">• Each weight ±10/25/50% · 1,000 Monte Carlo weightings</text>
  <text x="50" y="723" class="t">• Spearman rank agreement and level changes</text>
  <text x="44" y="751" class="c">engine/backtest.py · data/incidents.json</text>
  <text x="50" y="770" class="t">• 12 documented incidents: incident week vs 60 days earlier</text>
  <text x="50" y="788" class="t">• Baselines: stock only, news only, sentiment, headline count</text>
  <text x="44" y="816" class="c">engine/evaluation.py · data/labels.json</text>
  <text x="50" y="835" class="t">• Hand labels → accuracy, macro-F1, confusion matrix</text>
  <text x="44" y="863" class="c">backend/tests/test_model.py</text>
  <text x="50" y="882" class="t">• Unit tests: python -m unittest discover -s backend/tests</text>

  <!-- 7 Static dashboard -->
  <rect x="550" y="590" width="500" height="340" rx="8" class="box" stroke="#57606a"/>
  <path d="M550,598 a8,8 0 0 1 8,-8 h484 a8,8 0 0 1 8,8 v28 h-500 z" fill="#57606a"/>
  <text x="564" y="614" class="h">⑦ Dashboard (static: GitHub Pages / index.html)</text>
  <text x="564" y="650" class="b">Plain HTML + Chart.js, no build step</text>
  <text x="570" y="669" class="t">• Reads js/data.js; works opened from disk</text>
  <text x="564" y="697" class="b">Tabs</text>
  <text x="570" y="716" class="t">• Overview · All companies · Compare</text>
  <text x="570" y="734" class="t">• Search (with the server)</text>
  <text x="570" y="752" class="t">• MCDM: CRITIC, sensitivity, blend slider</text>
  <text x="570" y="770" class="t">• Validation: back-test, sentiment check, sources</text>
  <text x="570" y="788" class="t">• How it works: live worked examples</text>
  <text x="564" y="816" class="b">Every score explained</text>
  <text x="570" y="835" class="t">• Plain-English reasons, evidence per signal, TOPSIS working</text>
  <text x="570" y="853" class="t">• Light / dark, phone layout, table view of every chart</text>

  <!-- 8 Live server -->
  <rect x="1070" y="590" width="500" height="340" rx="8" class="box" stroke="#0969da"/>
  <path d="M1070,598 a8,8 0 0 1 8,-8 h484 a8,8 0 0 1 8,8 v28 h-500 z" fill="#0969da"/>
  <text x="1084" y="614" class="h">⑧ Live server (full app)</text>
  <text x="1084" y="650" class="c">backend/api.py (FastAPI)</text>
  <text x="1090" y="669" class="t">• start.bat · Docker · free Render (render.yaml)</text>
  <text x="1090" y="687" class="t">• Re-scores hourly, or on visit if &gt; 15 min old</text>
  <text x="1084" y="715" class="b">Adds to the dashboard</text>
  <text x="1090" y="734" class="t">• Search any NSE company, now or as of a past day</text>
  <text x="1090" y="752" class="t">• Add / remove watchlist companies</text>
  <text x="1090" y="770" class="t">• Run back-test · label headlines · score a headline</text>
  <text x="1084" y="798" class="b">REST API (docs at /docs)</text>
  <text x="1090" y="817" class="t">• /api/data · /api/search · /api/resolve</text>
  <text x="1090" y="835" class="t">• /api/watchlist · /api/backtest · /api/eval/*</text>
  <text x="1090" y="853" class="t">• /api/live/status · /api/live/refresh</text>

  <!-- Row B arrows -->
  <path d="M1116,520 V556 H280 V588" class="flow"/>
  <path d="M1350,520 V546 H800 V588" class="flow"/>
  <path d="M1480,520 V588" class="flow"/>

  <text x="30" y="968" class="s">Static mode needs no server (GitHub Pages runs on the daily job's data). The live server reuses the same pipeline and adds search, watchlist editing and the interactive validation tools.</text>
</svg>
