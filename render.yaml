# Render Blueprint: a free public server for the GitHub Pages dashboard.
# It refreshes the scores when someone opens the page (refresh on visit)
# and answers Company Search.
#
#   Render dashboard → New → Blueprint → connect this GitHub repo → Apply.
#
# Free plan: 0.1 CPU and 512 MB RAM. The service sleeps after 15 minutes
# without visitors and takes about a minute to wake up; a full refresh of
# the 50 companies takes a few minutes. Every push to main (including the
# daily FinBERT data commit from GitHub Actions) redeploys it from the
# latest daily results.
services:
  - type: web
    name: brand-risk-index
    runtime: python
    plan: free
    region: singapore            # the Render region closest to India
    branch: main
    buildCommand: pip install -r backend/requirements.txt -r backend/requirements-api.txt
    startCommand: python backend/api.py
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: SENTIMENT
        value: lexicon           # FinBERT needs about 2 GB of RAM; headlines the daily FinBERT run scored keep that score
      - key: REFRESH_ON_VISIT
        value: "true"            # re-score when a dashboard opens and the results are stale
      - key: STALE_MINUTES
        value: "15"              # at most one refresh per 15 minutes (polite to Yahoo and Google News)
      - key: LIVE_REFRESH
        value: "false"           # no hourly loop: the free instance sleeps when nobody visits
      - key: READ_ONLY
        value: "true"            # visitors can search, but cannot change files or start other re-runs
      - key: MAX_SEARCHES
        value: "2"               # parallel searches allowed on the small instance
